<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATIH MARKET</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #181818;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid gold;
}

header h1 {
  color: gold;
  margin: 0;
  font-size: 27px;
}

header p {
  color: #aaa;
  font-size: 12px;
}

.container {
  padding: 15px;
}

.search {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid gold;
  background: #222;
  color: white;
  margin-bottom: 15px;
}

button {
  background: gold;
  color: black;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.add {
  width: 100%;
  margin-bottom: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: #202020;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

.card h3 {
  font-size: 14px;
  margin: 5px 0;
}

.price {
  color: gold;
  font-weight: bold;
  margin: 8px 0;
}

.card a {
  display: block;
  text-align: center;
  padding: 10px;
  background: gold;
  color: black;
  text-decoration: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.form {
  display: none;
  background: #202020;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.form input,
.form textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  color: white;
}

.form button {
  width: 100%;
  margin-top: 8px;
}

footer {
